<div class="info">
    <div class="container">
        <div class="personal-title">Личный кабинет</div>

        <div class="personal-pages-selector">
            <div class="personal-page active">Личные данные</div>
            <div class="personal-page" routerLink="/orders">Ваши заказы</div>
        </div>

        <div class="data-form" [formGroup]="userInfoForm">
            <div class="data-form-block">
                <div class="data-form-label">Личные данные</div>
                <div class="data-form-label-additional">Введённые данные автоматически подставятся при оформлении
                    заказа.
                </div>
                <div class="data-form-inputs personal-data-inputs">
                    <input class="input" type="text" placeholder="Фамилия"
                           [ngStyle]="{'border-color': userInfoForm.get('lastName')?.invalid
                   && (userInfoForm.get('lastName')?.dirty || userInfoForm.get('lastName')?.touched) ? 'red' : ''}"
                           formControlName="lastName">
                    <input class="input" type="text" placeholder="Имя"
                           [ngStyle]="{'border-color': userInfoForm.get('firstName')?.invalid
                   && (userInfoForm.get('firstName')?.dirty || userInfoForm.get('firstName')?.touched) ? 'red' : ''}"
                           formControlName="firstName">
                    <input class="input" type="text" placeholder="Отчество"
                           [ngStyle]="{'border-color': userInfoForm.get('fatherName')?.invalid
                   && (userInfoForm.get('fatherName')?.dirty || userInfoForm.get('fatherName')?.touched) ? 'red' : ''}"
                           formControlName="fatherName">
                    <input class="input" type="text" placeholder="Телефон"
                           [ngStyle]="{'border-color': userInfoForm.get('phone')?.invalid
                   && (userInfoForm.get('phone')?.dirty || userInfoForm.get('phone')?.touched) ? 'red' : ''}"
                           formControlName="phone">
                    <input class="input" type="text" placeholder="E-mail"
                           [ngStyle]="{'border-color': userInfoForm.get('email')?.invalid
                   && (userInfoForm.get('email')?.dirty || userInfoForm.get('email')?.touched) ? 'red' : ''}"
                           formControlName="email">
                </div>
            </div>
            <div class="data-form-block">
                <div class="data-form-label">Адрес доставки</div>
                <div class="data-form-inputs address-inputs">
                    <input class="input street" type="text" placeholder="Улица"
                           [ngStyle]="{'border-color': userInfoForm.get('street')?.invalid
                   && (userInfoForm.get('street')?.dirty || userInfoForm.get('street')?.touched) ? 'red' : ''}"
                           formControlName="street">
                    <input class="input house" type="text" placeholder="№ дома"
                           [ngStyle]="{'border-color': userInfoForm.get('house')?.invalid
                   && (userInfoForm.get('house')?.dirty || userInfoForm.get('house')?.touched) ? 'red' : ''}"
                           formControlName="house">
                    <input class="input entrance" type="text" placeholder="Подъезд"
                           [ngStyle]="{'border-color': userInfoForm.get('entrance')?.invalid
                   && (userInfoForm.get('entrance')?.dirty || userInfoForm.get('entrance')?.touched) ? 'red' : ''}"
                           formControlName="entrance">
                    <input class="input apartment" type="text" placeholder="№ квартиры"
                           [ngStyle]="{'border-color': userInfoForm.get('apartment')?.invalid
                   && (userInfoForm.get('apartment')?.dirty || userInfoForm.get('apartment')?.touched) ? 'red' : ''}"
                           formControlName="apartment">
                </div>
            </div>
            <div class="data-form-block">
                <div class="data-form-label">Предпочитаемый способ доставки</div>
                <div class="data-form-types">
                    <div class="data-form-type" [class.active]="deliveryType === deliveryTypes.delivery"
                         (click)="changeDeliveryType(deliveryTypes.delivery)">Курьером
                    </div>
                    <div class="data-form-type" [class.active]="deliveryType === deliveryTypes.self"
                         (click)="changeDeliveryType(deliveryTypes.self)">Самовывоз
                    </div>
                </div>
            </div>
            <div class="data-form-block">
                <div class="data-form-label">Предпочитаемый способ оплаты</div>
                <div class="data-form-radio">
                    <div class="data-form-radio-block">
                        <input class="input" type="radio" id="card" value="{{paymentTypes.cardOnline}}"
                               formControlName="paymentType">
                        <label for="card">Оплата банковской картой в интернет-магазине</label>
                    </div>
                    <div class="data-form-radio-block">
                        <input class="input" type="radio" id="cashless" value="{{paymentTypes.cardToCourier}}"
                               formControlName="paymentType">
                        <label for="cashless">Безналичный расчет при получении</label>
                    </div>
                    <div class="data-form-radio-block">
                        <input class="input" type="radio" id="cash" value="{{paymentTypes.cashToCourier}}"
                               formControlName="paymentType">
                        <label for="cash">Наличный расчет при получении</label>
                    </div>
                </div>
            </div>

            <button class="button" [disabled]="!(userInfoForm.dirty && userInfoForm.valid)" (click)="updateUserInfo()">
                Сохранить
            </button>
        </div>

    </div>

    <div class="page-image img-wrapper">
        <img src="/assets/images/page/main.png" alt="Flower">
    </div>
</div>
