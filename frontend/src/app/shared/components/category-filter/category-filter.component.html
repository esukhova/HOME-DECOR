<div class="catalog-filter" [class.open]="open">
    <div class="catalog-filter-head" (click)="toggle()">
        <span>{{ title }}</span>
        <svg width="16" height="8" viewBox="0 0 16 8" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M8.00026 8.00003C7.41693 8.00003 6.83359 7.77503 6.39193 7.33337L0.958594 1.90003C0.716927 1.65837 0.716927 1.25837 0.958594 1.0167C1.20026 0.775033 1.60026 0.775033 1.84193 1.0167L7.27526 6.45003C7.67526 6.85003 8.32526 6.85003 8.72526 6.45003L14.1586 1.0167C14.4003 0.775033 14.8003 0.775033 15.0419 1.0167C15.2836 1.25837 15.2836 1.65837 15.0419 1.90003L9.60859 7.33337C9.16693 7.77503 8.58359 8.00003 8.00026 8.00003Z"
                fill="#2C2C2C"/>
        </svg>
    </div>
    <div class="catalog-filter-body-wrapper">
        <div class="catalog-filter-body">
            <label *ngFor="let type of categoryWithTypes?.types" class="catalog-filter-checkbox">
                <input type="checkbox" #input (change)="updateFilterParam(type.url, input.checked)"
                       [checked]="activeParams.types.includes(type.url)">
                <span>{{ type.name }}</span>
            </label>

            <div class="catalog-filter-from-to" *ngIf="type">
                <span>от</span>
                <input type="text" maxlength="3" [ngModel]="from"
                       (ngModelChange)="updateFilterParamFromTo(type + 'From', $event)" class="small-input">
                <span>до</span>
                <input type="text" maxlength="3" [ngModel]="to"
                       (ngModelChange)="updateFilterParamFromTo(type + 'To', $event)" class="small-input">
                <span>см</span>
            </div>
        </div>
    </div>
</div>
